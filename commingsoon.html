    <style>
        :root {
            --overlay: rgba(0,0,0,0.5);
            --primary: #fff;
            --accent: #00bfae;
            --font: 'Segoe UI', Arial, sans-serif;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(var(--overlay), var(--overlay)), url('assets/img/hero-bg.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font);
            color: var(--primary);
        }
        .container {
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 2.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 80px;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0 0 1rem 0;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #e0e0e0;
        }
        .notify-form {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .notify-form input[type="email"] {
            padding: 0.7rem 1rem;
            border: none;
            border-radius: 2rem;
            outline: none;
            font-size: 1rem;
            width: 65%;
            min-width: 150px;
        }
        .notify-form button {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 2rem;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .notify-form button:hover {
            background: #009e8e;
        }
        @media (max-width: 500px) {
            .container {
                padding: 1.5rem 0.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .logo {
                width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Optional: Place your logo here -->
        <img src="assets/img/logo.png" alt="KML Group SL Logo" class="logo">
        <h1>Coming Soon</h1>
        <p>Our website is under construction.<br>
            We'll be here soon with our new awesome site.</p>
        <div id="countdown" class="countdown">
            <div class="countdown-segment">
            <span id="days" class="countdown-number">00</span>
            <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-separator">:</div>
            <div class="countdown-segment">
            <span id="hours" class="countdown-number">00</span>
            <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-separator">:</div>
            <div class="countdown-segment">
            <span id="minutes" class="countdown-number">00</span>
            <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-separator">:</div>
            <div class="countdown-segment">
            <span id="seconds" class="countdown-number">00</span>
            <span class="countdown-label">Seconds</span>
            </div>
        </div>
        <script>
            // Set your launch date here (YYYY-MM-DDTHH:MM:SS)
            const launchDate = new Date('2025-07-20T00:00:00').getTime();

            function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.max(0, Math.floor(distance / (1000 * 60 * 60 * 24)));
            const hours = Math.max(0, Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
            const minutes = Math.max(0, Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)));
            const seconds = Math.max(0, Math.floor((distance % (1000 * 60)) / 1000));

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        </script>
        <style>
            .countdown {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 2rem;
            font-family: var(--font);
            }
            .countdown-segment {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 55px;
            }
            .countdown-number {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent);
            background: rgba(0,191,174,0.08);
            border-radius: 0.5rem;
            padding: 0.2em 0.7em;
            margin-bottom: 0.2em;
            box-shadow: 0 2px 8px rgba(0,191,174,0.07);
            letter-spacing: 1px;
            }
            .countdown-label {
            font-size: 0.85rem;
            color: #e0e0e0;
            letter-spacing: 1px;
            text-transform: uppercase;
            }
            .countdown-separator {
            font-size: 2rem;
            color: #fff;
            opacity: 0.7;
            align-self: center;
            margin: 0 0.1em;
            font-weight: bold;
            }
            @media (max-width: 500px) {
            .countdown {
                gap: 0.5rem;
            }
            .countdown-number {
                font-size: 1.2rem;
                padding: 0.1em 0.4em;
            }
            .countdown-label {
                font-size: 0.7rem;
            }
            .countdown-segment {
                min-width: 35px;
            }
            .countdown-separator {
                font-size: 1.2rem;
            }
            }
        </style>
    </div>
</body>
